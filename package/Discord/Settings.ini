# Monster Girl Quest! Paradox RPG - Discord Rich Presence
#
#
# These are the game's "[Discord] Rich Presence" options, which the game
# changes when you switch them in its options menu. Edit them by hand only
# while the game is closed.
#
# The big image on the card is the game's icon unless the picture options
# below pick another. Hovering it shows where the story stands and the party
# leader, race and class.

# presence = 0 shows nothing about the game on Discord, without uninstalling
# the mod ("[Discord] Rich Presence"). The options after it keep their values.
#
presence = 1

# nsfw = 1 shows requests, defeat scenes and battle fucks on Discord ("NSFW").
#
nsfw = 0

# all_saves = 0 counts defeats, escapes, wipeouts, syntheses, gold spent and
# the biggest hit per save instead of across all saves, and battle fucks won
# as the save's own count ("Statistics").
#
all_saves = 1

# spoilers = 1 shows what spoils Part 3 on Discord while you play it: the
# spoiler trivia, the map and character names on the first line and the
# routes' names ("Spoilers"). spoilers = 0 leaves them out.
#
spoilers = 0

# picture = 1 shows Ilias or Alice, whoever you chose, later the route you are
# on, and the collab's heroes during the Collaboration Scenario ("Picture").
#
picture = 0

# shown_picture is the picture shown while picture = 0 ("Shown Picture"):
# 0 the application's icon, 1 Ilias (adult), 2 Ilias (sealed), 3 Alice
# (adult), 4 Alice (sealed), 5 Judgment (logo), 6 Judgment (layered),
# 7 Destroyer (logo), 8 Destroyer (layered), 9 Chaos, 10 Collaboration Scenario.
#
shown_picture = 0

# sealed_sides = 0 shows Ilias or Alice in her adult form instead of sealed
# while picture = 1 ("Ilias / Alice").
#
sealed_sides = 1

# layered_routes = 0 shows the Judgment and Destroyer routes' logos alone
# instead of over their heroines while picture = 1 ("Routes").
#
layered_routes = 1
